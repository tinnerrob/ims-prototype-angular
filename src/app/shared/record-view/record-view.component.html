<!-- Shared read-only record viewer (opened by clicking a table row) -->
@if (view; as v) {
  <div class="modal show d-block" tabindex="-1" role="dialog" imsModalDismiss (dismiss)="closed.emit()">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi {{ v.icon || 'bi-eye' }}"></i>{{ v.title }}</h5>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          @if (v.subtitle) {
            <div class="text-muted2 text-xs mb-1">{{ v.subtitle }}</div>
          }
          @if (v.badge) {
            <div class="mb-3">
              <span class="badge-status {{ v.badgeClass || 'st-on' }}">{{ v.badge }}</span>
            </div>
          }
          @for (s of v.sections; track $index) {
            @if (s.title) {
              <div class="strong mb-1 mt-3">{{ s.title }}</div>
            }
            @for (f of s.fields; track $index) {
              <div class="list-line">
                <span class="l text-muted2">{{ f.label }}</span>
                <span class="r text-end" [class.mono]="f.mono">{{ f.value }}</span>
              </div>
            }
          }
        </div>
        @if (editable) {
          <div class="modal-footer">
            <button type="button" class="btn btn-ims" (click)="edit.emit()">
              <i class="bi bi-pencil"></i> Edit
            </button>
          </div>
        }
      </div>
    </div>
  </div>
  <div class="modal-backdrop show d-block"></div>
}
