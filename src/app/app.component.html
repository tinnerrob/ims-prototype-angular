<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">IMS</span>
      <div class="brand-text">
        <span class="brand-name">Universal Inventory Suite</span>
        <span class="brand-sub">Angular port</span>
      </div>
    </div>

    <nav class="side-nav">
      @for (g of groups; track g.title) {
        <div class="nav-section">{{ g.title }}</div>
        @for (item of g.items; track item.route) {
          <a
            class="nav-link"
            routerLink="{{ item.route }}"
            routerLinkActive="active"
            [class.disabled]="item.soon"
            (click)="item.soon && $event.preventDefault()"
          >{{ item.label }}{{ item.soon ? ' · soon' : '' }}</a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <div class="sim-status"><span class="pulse-dot"></span> Local prototype data</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">IMS</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date">{{ today }}</span>
      </div>
    </header>

    <div class="content">
      <router-outlet />
    </div>
  </main>
</div>
